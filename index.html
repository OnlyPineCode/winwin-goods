<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>追星物料管理台</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#F2F2F7; --bg-elev:#FFFFFF; --card:#FFFFFF;
  --txt:#000000; --txt2:#8E8E93; --txt3:#C7C7CC;
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12);
  --nav:rgba(249,249,249,.80); --mask:rgba(0,0,0,.40);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --purple:#AF52DE; --indigo:#5856D6; --teal:#30B0C7; --pink:#FF2D55;
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#000000; --bg-elev:#1C1C1E; --card:#1C1C1E;
  --txt:#FFFFFF; --txt2:#8E8E93; --txt3:#48484A;
  --sep:rgba(84,84,88,.60); --fill:rgba(118,118,128,.24);
  --nav:rgba(30,30,32,.78); --mask:rgba(0,0,0,.60);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --purple:#BF5AF2; --indigo:#5E5CE6; --teal:#40C8E0; --pink:#FF375F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ============ 布局 ============ */
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hd{
  position:sticky;top:0;z-index:20;
  background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.hd-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:34px}
.hd h1{margin:0;font-size:32px;line-height:1.15;font-weight:700;letter-spacing:-.5px}
.hd .sub{font-size:13px;color:var(--txt2);padding-bottom:5px;white-space:nowrap}
.hd-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  height:32px;padding:0 12px;border-radius:16px;background:var(--fill);
  font-size:15px;font-weight:600;color:var(--blue);flex:0 0 auto;
}
.hd-btn.plain{background:none;padding:0 4px}

/* 搜索框 */
.search{position:relative;margin-top:10px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.42}
.search input{
  width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);
  padding:0 12px 0 32px;outline:none;font-size:16px;
}
.search input::placeholder{color:var(--txt2)}

/* 横向滚动 chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  height:30px;padding:0 12px;border-radius:15px;background:var(--fill);
  font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap;
}
.chip.on{background:var(--blue);color:#fff}
.chip .cnt{opacity:.55;font-size:12px;font-weight:400}
.chip.on .cnt{opacity:.8}

/* 分段控件 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:14px;font-weight:500;color:var(--txt)}
.seg button.on{background:var(--bg-elev);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* 内容 */
.content{padding:12px 16px 8px}
.group{margin-bottom:22px}
.group-head{display:flex;align-items:baseline;gap:8px;margin:0 4px 8px}
.group-head .t{font-size:17px;font-weight:700;letter-spacing:-.2px}
.group-head .t.muted{color:var(--txt2)}
.group-head .n{font-size:13px;color:var(--txt2)}
.group-head .rt{margin-left:auto;font-size:13px;color:var(--txt2);text-align:right}
.act-sum{display:flex;align-items:center;gap:10px;margin:-2px 4px 10px}
.act-sum .bar{flex:1;margin-top:0}
.act-sum .pc{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums;flex:0 0 auto}

.rows{background:var(--card);border-radius:var(--radius)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.row.press:active{background:var(--fill)}
.row-main{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-sub{font-size:13px;color:var(--txt2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chev{color:var(--txt3);flex:0 0 auto}
.plan-main{display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-align:left}

/* 缩略图 */
.thumb{
  width:54px;height:54px;border-radius:11px;flex:0 0 auto;overflow:hidden;
  background:var(--fill);display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.lg{width:96px;height:96px;border-radius:16px;font-size:34px}
.thumb.sm{width:34px;height:34px;border-radius:9px;font-size:13px}
.thumb.xs{width:26px;height:26px;border-radius:7px;font-size:11px}

/* 药丸 */
.pill{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;
  border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap;
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
button.pill:active{opacity:.75}
.tag{
  display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;
  background:var(--fill);font-size:12px;color:var(--txt2);white-space:nowrap;
}
.tag.plain{background:transparent;padding:0}

/* 进度条 */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .25s}
.bar.done>i{background:var(--green)}
.bar-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar-row .bar{flex:1;margin-top:0}
.bar-row .pc{font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:34px;text-align:right}

/* 统计小卡 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--txt2);display:block;margin-top:3px}

/* 步进器 */
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:8px;overflow:hidden;flex:0 0 auto}
.stepper button{width:30px;height:28px;font-size:17px;font-weight:600;color:var(--blue);display:flex;align-items:center;justify-content:center}
.stepper button:active{background:var(--sep)}
.stepper .v{min-width:34px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

/* 互换行 */
.ex-lines{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.ex-line{display:flex;align-items:baseline;gap:7px;font-size:14px;min-width:0}
.ex-line .lbl{flex:0 0 auto;font-size:11px;font-weight:700;line-height:16px;padding:0 6px;border-radius:5px}
.ex-line .nm{font-weight:500;min-width:0;word-break:break-all}
.ex-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.ex-foot .sum{margin-left:auto;font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.ex-foot .sum b{font-weight:600}

/* 空状态 */
.empty{padding:56px 24px;text-align:center;color:var(--txt2)}
.empty .ico{font-size:40px;opacity:.35;margin-bottom:10px}
.empty .t{font-size:16px;font-weight:600;color:var(--txt);margin-bottom:6px}
.empty .d{font-size:13px;line-height:1.6}

.btn{
  height:44px;padding:0 20px;border-radius:12px;background:var(--blue);color:#fff;
  font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{opacity:.8}
.btn.ghost{background:var(--fill);color:var(--blue)}
.btn.gray{background:var(--fill);color:var(--txt)}
.btn.danger{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn.sm{height:36px;font-size:15px;padding:0 14px;border-radius:10px}
.btn[disabled]{opacity:.45}
.btn-group{display:flex;gap:10px;margin-top:14px}
.btn-group .btn{flex:1}

/* ============ 底部标签栏 ============ */
.tabbar-wrap{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.tabbar{
  width:100%;max-width:540px;pointer-events:auto;
  background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt2);font-size:10px;font-weight:500;
}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:25px;height:25px}

/* ============ 底部弹层 ============ */
#sheet-root{position:fixed;inset:0;z-index:100;display:none}
#sheet-root.open{display:block}
.mask{position:absolute;inset:0;background:var(--mask);opacity:0;transition:opacity .25s}
#sheet-root.show .mask{opacity:1}
.sheet{
  position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);
  width:100%;max-width:540px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-radius:18px 18px 0 0;
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}
#sheet-root.show .sheet{transform:translate(-50%,0)}
.sheet-hd{
  position:sticky;top:0;z-index:5;background:var(--nav);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;gap:10px;padding:12px 16px;
}
.sheet-hd .ttl{flex:1;font-size:17px;font-weight:700;text-align:center;letter-spacing:-.2px}
.sheet-hd button{font-size:16px;color:var(--blue);font-weight:500;min-width:44px;text-align:left}
.sheet-hd button.rt{text-align:right;font-weight:600}
.sheet-hd span.ph{min-width:44px}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--txt3);margin:8px auto 0;opacity:.6}
.sheet-body{padding:16px}

/* 表单 */
.fieldset{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.field{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;min-height:48px}
.field+.field::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.field label{width:84px;flex:0 0 auto;font-size:15px;color:var(--txt);font-weight:500}
.field label.req::after{content:"*";color:var(--red);margin-left:2px}
.field input,.field select,.field textarea{
  flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:0;
  -webkit-appearance:none;appearance:none;
}
.field input::placeholder,.field textarea::placeholder{color:var(--txt3)}
.field select{text-align:right;direction:ltr}
.field .suffix{color:var(--txt2);font-size:14px;flex:0 0 auto}
.field.col{flex-direction:column;align-items:stretch;gap:6px}
.field.col label{width:auto}
.field textarea{width:100%;resize:none;min-height:60px;line-height:1.5}
.field .sel-arrow{color:var(--txt3);flex:0 0 auto;margin-left:-6px}
.form-label{font-size:13px;color:var(--txt2);margin:0 4px 7px;font-weight:500}
.form-label .hint{color:var(--txt3);font-weight:400}
.pick-wrap{background:var(--card);border-radius:var(--radius);padding:12px 10px;margin-bottom:16px}
.pick-wrap .pick-hd{font-size:13px;color:var(--txt2);margin:0 4px 8px;font-weight:500}

.img-picker{
  display:flex;align-items:center;gap:10px;padding:14px;background:var(--card);
  border-radius:var(--radius);margin-bottom:16px;
}
.img-picker .ph{width:56px;height:56px;border-radius:12px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:24px;flex:0 0 auto}
.img-picker .ph img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.img-picker .info{flex:1;min-width:0}
.img-picker .l1{font-size:15px;font-weight:600}
.img-picker .l2{font-size:12px;color:var(--txt2);margin-top:2px}

.linebox{background:var(--card);border-radius:var(--radius);padding:6px 10px 12px;margin-bottom:16px}
.linebox .lb-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 4px}
.linebox .lb-hd .lb-t{font-size:14px;font-weight:600}
.linebox .add{font-size:14px;color:var(--blue);font-weight:500;flex:0 0 auto}
.lrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.lrow select{
  flex:1;min-width:0;height:38px;border-radius:9px;background:var(--fill);border:0;
  padding:0 8px;font-size:14px;-webkit-appearance:none;appearance:none;text-align:left;
}
.lrow input[type=number]{
  width:56px;height:38px;border-radius:9px;background:var(--fill);border:0;
  text-align:center;font-size:15px;font-weight:600;outline:none;flex:0 0 auto;
  -webkit-appearance:none;appearance:none;
}
.lrow input[type=number]::-webkit-outer-spin-button,
.lrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lrow .del{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--red);font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lrow .txt{flex:1;min-width:0;height:38px;border-radius:9px;background:var(--fill);border:0;padding:0 10px;font-size:14px;outline:none}
.lrow .imgbtn{
  width:38px;height:38px;border-radius:9px;background:var(--fill);flex:0 0 auto;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:16px;
}
.lrow .imgbtn img{width:100%;height:100%;object-fit:cover;display:block}

/* 详情 */
.detail-hero{display:flex;gap:14px;align-items:flex-start;padding:0 0 16px}
.detail-hero .meta{flex:1;min-width:0}
.detail-hero .nm{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.detail-hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;font-size:15px;position:relative;align-items:center}
.kv+.kv::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.kv .k{color:var(--txt2);flex:0 0 auto;display:flex;align-items:center}
.kv .v{text-align:right;font-weight:500;word-break:break-word}
.rx-imgs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}
.rx-imgs img{width:64px;height:64px;border-radius:10px;object-fit:cover}

/* 表格（统计） */
.tbl{background:var(--card);border-radius:var(--radius);overflow:hidden;font-size:14px}
.tbl .tr{display:flex;align-items:center;gap:8px;padding:10px 12px;position:relative}
.tbl .tr+.tr::before{content:"";position:absolute;top:0;left:12px;right:12px;height:.5px;background:var(--sep)}
.tbl .tr.head{background:var(--fill);font-size:12px;color:var(--txt2);font-weight:600}
.tbl .c1{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.tbl .c1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .c2,.tbl .c3,.tbl .c4{width:44px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tbl .c4{width:52px;font-weight:600}

/* 设置 */
.setnote{font-size:12px;color:var(--txt2);line-height:1.6;margin:8px 4px 0}
.setnote b{color:var(--txt)}
.setnote code{background:var(--fill);padding:1px 5px;border-radius:4px;font-size:11px;font-family:ui-monospace,Menlo,monospace}
.swatch{width:26px;height:26px;border-radius:50%;flex:0 0 auto;border:2px solid var(--bg-elev);box-shadow:0 0 0 .5px var(--sep)}
.pal{display:flex;gap:12px;flex-wrap:wrap;padding:6px 2px 2px}
.pal button{width:34px;height:34px;border-radius:50%;position:relative}
.pal button.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}

/* 弹窗 */
#dialog-root{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:32px}
#dialog-root.open{display:flex}
#dialog-root .mask{opacity:1}
.dlg{
  position:relative;width:100%;max-width:280px;background:var(--bg-elev);border-radius:14px;
  overflow:hidden;text-align:center;transform:scale(1.14);opacity:0;transition:all .2s;
}
#dialog-root.show .dlg{transform:scale(1);opacity:1}
.dlg .dt{padding:19px 16px 15px;font-size:17px;font-weight:600}
.dlg .dm{padding:0 16px 18px;font-size:13px;color:var(--txt2);line-height:1.5;margin-top:-8px}
.dlg .da{display:flex;border-top:.5px solid var(--sep)}
.dlg .da button{flex:1;height:44px;font-size:17px;color:var(--blue)}
.dlg .da button+button{border-left:.5px solid var(--sep)}
.dlg .da button.strong{font-weight:600}
.dlg .da button.danger{color:var(--red)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:rgba(0,0,0,.84);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;
  z-index:300;opacity:0;transition:all .25s;pointer-events:none;max-width:80vw;text-align:center;
}
html[data-theme="dark"] #toast{background:rgba(255,255,255,.92);color:#000}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>
<div class="tabbar-wrap">
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheet-root"><div class="mask" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div id="dialog-root"><div class="mask" data-act="closeDialog"></div><div class="dlg" id="dialog"></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   追星物料管理台  v2.0
   物料库 / 企划制作 / 互换记录 + 设置
   ========================================================= */

/* ---------- 常量 ---------- */
const DEFAULT_CATEGORIES = ['手幅','小卡','贴纸','亚克力','徽章','扇子','手绳','帆布袋','玩偶','立牌','明信片','挂件','文件夹','其他'];
const DEFAULT_STATUSES = [
  {k:'企划中', c:'#8E8E93'},
  {k:'设计中', c:'#AF52DE'},
  {k:'打样中', c:'#FF9500'},
  {k:'制作中', c:'#007AFF'},
  {k:'待收货', c:'#5856D6'},
  {k:'已完成', c:'#34C759'},
  {k:'暂停',   c:'#FF3B30'},
];
const EX_STATUS = [
  {k:'待面交', c:'#FF9500'},
  {k:'待寄出', c:'#007AFF'},
  {k:'已完成', c:'#34C759'},
];
const ACT_TYPES = ['演唱会','见面会','签售会','生日应援','线下展台','投递应援','其他'];
const CUSTOM = '__custom__';

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
function tint(hex, a){
  const h = String(hex || '#8E8E93').replace('#','');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const n = parseInt(full, 16);
  if (!isFinite(n)) return 'rgba(142,142,147,' + a + ')';
  return 'rgba(' + (n>>16&255) + ',' + (n>>8&255) + ',' + (n&255) + ',' + a + ')';
}
function pigment(str){
  let h = 0; str = String(str||'?');
  for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDate(s){
  if (!s) return '';
  const p = String(s).split('-');
  return p.length === 3 ? (Number(p[1]) + '月' + Number(p[2]) + '日') : s;
}
function fmtTime(ts){
  if (!ts) return '从未';
  const d = new Date(ts);
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1900);
}
function statusColor(k, list){ const f = (list||[]).find(x => x.k === k); return f ? f.c : '#8E8E93'; }
function pill(k, list){
  const c = statusColor(k, list);
  return '<span class="pill" style="color:'+c+';background:'+tint(c,.15)+'"><i class="dot"></i>'+esc(k)+'</span>';
}
function pillBtn(act, id, k, list){
  const c = statusColor(k, list);
  return '<button class="pill" data-act="'+act+'" data-id="'+id+'" style="color:'+c+';background:'+tint(c,.15)+'"><i class="dot"></i>'+esc(k)+'</button>';
}
function tagsHTML(arr){
  if (!arr || !arr.length) return '';
  return arr.map(t => '<span class="tag">#'+esc(t)+'</span>').join('');

/* ---------- 存储层 ---------- */
const Store = (() => {
  const KEY = 'starmerch.v2';
  const DB_NAME = 'starmerch_db';
  let dbp = null;
  function openDB(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  return {
    async get(){
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const q = db.transaction('kv','readonly').objectStore('kv').get(KEY);
          q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
        });
      } catch(e){
        try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(_) { return null; }
      }
    },
    async set(v){
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const q = db.transaction('kv','readwrite').objectStore('kv').put(v, KEY);
          q.onsuccess = () => res(); q.onerror = () => rej(q.error);
        });
      } catch(e){
        try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(_) { toast('本地存储已满，建议压缩图片或清理数据'); }
      }
    }
  };
})();

/* ---------- 查询辅助 ---------- */
function normalize(){
  if (!Array.isArray(DB.categories) || !DB.categories.length) DB.categories = DEFAULT_CATEGORIES.slice();
  if (!Array.isArray(DB.statuses) || !DB.statuses.length) DB.statuses = JSON.parse(JSON.stringify(DEFAULT_STATUSES));
  DB.items.forEach(i => {
    if (!Array.isArray(i.activityIds)) i.activityIds = i.activityId ? [i.activityId] : [];
    delete i.activityId;
    i.activityIds = (i.activityIds || []).filter(x => !!actRaw(x));
    if (!DB.statuses.some(s => s.k === i.status)) i.status = DB.statuses[0].k;
    if (i.category && !DB.categories.includes(i.category)) DB.categories.push(i.category);
  });
  DB.exchanges.forEach(e => {
    if (!EX_STATUS.some(s => s.k === e.status)) e.status = '待寄出';
    e.give = (e.give || []).map(l => ({ itemId:l.itemId || '', qty:num(l.qty) })).filter(l => l.itemId && l.qty > 0);
    e.receive = (e.receive || []).map(l => ({ name:(l.name || '').trim(), qty:num(l.qty), image:l.image || '' }))
                                 .filter(l => l.name && l.qty > 0);
  });
}
const actRaw = id => DB.activities.find(a => a.id === id);
const actName = id => { const a = actRaw(id); return a ? a.name : ''; };
const itemById = id => DB.items.find(x => x.id === id);
const actsOf = it => (it && it.activityIds) ? it.activityIds.filter(x => !!actRaw(x)) : [];
const actOrder = id => { const i = DB.activities.findIndex(x => x.id === id); return i < 0 ? 9999 : i; };
function sortActs(list){ return list.slice().sort((a,b) => actOrder(a.id) - actOrder(b.id)); }
function allTags(obj){
  const s = new Set();
  obj.forEach(x => (x.tags || []).forEach(t => t && s.add(t)));
  return Array.from(s);
}
function exchangeFlow(){
  const m = {};
  const bump = (key, field, qty) => {
    if (!key) return;
    if (!m[key]) m[key] = { out:0, in:0 };
    m[key][field] += num(qty);
  };
  DB.exchanges.forEach(e => {
    (e.give || []).forEach(l => bump(l.itemId, 'out', l.qty));
    (e.receive || []).forEach(l => bump('custom:' + (l.name || '').trim(), 'in', l.qty));
  });
  return m;
}
const flowOf = (flow, id) => flow[id] || { out:0, in:0 };
function availOf(it, flow){
  const f = flowOf(flow, it.id);
  return Math.max(0, num(it.madeQty) - f.out + f.in + num(it.stockAdj));
}
const sumQty = (e, side) => (e[side] || []).reduce((s,l) => s + num(l.qty), 0);

function viewLibrary(){

  if (ui.lib.cat !== 'all') list = list.filter(i => (i.category || '未分类') === ui.lib.cat);
  if (ui.lib.tag !== 'all') list = list.filter(i => (i.tags || []).includes(ui.lib.tag));

  const totalPlan = list.reduce((s,i) => s + num(i.planQty), 0);
  const totalMade = list.reduce((s,i) => s + num(i.madeQty), 0);
  const todo = Math.max(0, totalPlan - totalMade);
  let rest = 0;
  list.forEach(i => { rest += availOf(i, flow); });

  let html = '';
  if (ui.lib.group === 'none'){
    html = list.length ? '<div class="group">' + rowsItems(list, flow) + '</div>' : '';
  } else {
    const secs = [];
    if (ui.lib.group === 'activity'){
      sortActs(DB.activities).forEach(a => {
        const its = list.filter(i => actsOf(i).includes(a.id));
        if (its.length) secs.push({ name:a.name, items:its });
      });
      const noAct = list.filter(i => !actsOf(i).length);
      if (noAct.length) secs.push({ name:'未挂活动', items:noAct, muted:true });
    } else {
      const map = new Map();
      list.forEach(i => {
        const k = i.category || '未分类';
        if (!map.has(k)) map.set(k, []);
        map.get(k).push(i);
      });
      map.forEach((its, k) => secs.push({ name:k, items:its }));
    }
    if (!list.length && DB.items.length) html = emptyState('没有匹配的物料','试试换个筛选条件或关键词。','','');
    secs.forEach(sec => {
      const p = sec.items.reduce((s,i) => s + num(i.planQty), 0);

    + '<span class="cnt">'+DB.items.filter(i => actsOf(i).includes(a.id)).length+'</span></button>'
  ).join('');
  const catSet = new Set(DB.categories);
  DB.items.forEach(i => { if (i.category) catSet.add(i.category); });
  const catChips = Array.from(catSet).map(c =>
    '<button class="chip'+(ui.lib.cat===c?' on':'')+'" data-act="lib-cat" data-v="'+esc(c)+'">'+esc(c)+'</button>'
  ).join('');
  const tagChips = allTags(DB.items).map(t =>
    '<button class="chip'+(ui.lib.tag===t?' on':'')+'" data-act="lib-tag" data-v="'+esc(t)+'">#'+esc(t)+'</button>'
  ).join('');

  return ''
  + '<div class="hd">'
  +   '<div class="hd-row"><h1>物料库</h1>'
  +     '<button class="hd-btn" data-act="lib-new">＋ 新增</button></div>'

function rowsItems(list, flow){
  if (!list.length) return '';
  return '<div class="rows">' + list.map(i => {
    const f = flowOf(flow, i.id);
    const rest = availOf(i, flow);
    const plan = num(i.planQty), made = num(i.madeQty);
    const todo = Math.max(0, plan - made);
    const sc = statusColor(i.status, DB.statuses);
    const actTags = ui.lib.group === 'activity' ? '' : actsOf(i).map(a => '<span class="tag">'+esc(actName(a))+'</span>').join('');
    return '<button class="row press" data-act="open-item" data-id="'+i.id+'">'
      + thumbHTML(i, '')
      + '<div class="row-main">'
      +   '<div class="row-title">'+esc(i.name||'未命名')+'</div>'
      +   '<div class="row-sub">'+(i.category?'<span>'+esc(i.category)+'</span>':'')
      +     (plan ? '<span>计划 '+plan+'</span>' : '')
      +     (todo ? '<span>待做 '+todo+'</span>' : '')
      +     '<span>已做 '+made+'</span>'
      +     '<span style="color:var(--blue);font-weight:600">余量 '+rest+'</span>'
      +     (f.out ? '<span style="color:var(--orange)">换出 '+f.out+'</span>' : '')
      +     (f.in ? '<span style="color:var(--blue)">换入 '+f.in+'</span>' : '')
      +   '</div>'
      +   (((i.tags||[]).length || actTags) ? '<div class="row-sub" style="margin-top:5px">'+tagsHTML(i.tags)+actTags+'</div>' : '')
      +   (plan>0 ? '<div class="bar'+(made>=plan?' done':'')+'"><i style="width:'+Math.min(100,Math.round(made/plan*100))+'%"></i></div>' : '')
      + '</div>'
      + '<div class="row-right"><span class="pill" style="color:'+sc+';background:'+tint(sc,.15)+'"><i class="dot"></i>'+esc(i.status||'')+'</span></div>'
      + '<svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5L6 6.5l-4.5 5"/></svg>'
      + '</button>';
  }).join('') + '</div>';
}

function thumbHTML(it, cls){
  if (it.image) return '<div class="thumb '+cls+'"><img src="'+it.image+'" alt=""></div>';
  const ch = (it.name||'?').trim().charAt(0);
  return '<div class="thumb '+cls+'" style="background:'+pigment(it.name)+'">'+esc(ch)+'</div>';
}

function planCards(list, flow){
  return '<div class="rows">' + list.map(i => {
    const plan = num(i.planQty), made = num(i.madeQty);
    const todo = Math.max(0, plan - made);
    const pct = plan ? Math.min(100, Math.round(made / plan * 100)) : 0;
    const f = flowOf(flow, i.id);
    const rest = availOf(i, flow);
    const sub = (i.category ? '<span>'+esc(i.category)+'</span>' : '')
      + (plan ? '<span>计划 '+plan+'</span>' : '')
      + (todo ? '<span>待做 '+todo+'</span>' : '')
      + '<span>已做 '+made+'</span>'
      + '<span style="color:var(--blue);font-weight:600">余量 '+rest+'</span>'
      + (f.out ? '<span style="color:var(--orange)">换出 '+f.out+'</span>' : '');
    return '<div class="row">'
      + '<button class="plan-main" data-act="open-item" data-id="'+i.id+'">'
      +   thumbHTML(i,'')
      +   '<div class="row-main" style="min-width:0">'
      +     '<div class="row-title">'+esc(i.name||'未命名')+'</div>'
      +     '<div class="row-sub">'+sub+'</div>'
      +     '<div class="bar-row"><div class="bar'+(pct>=100?' done':'')+'"><i style="width:'+pct+'%"></i></div><span class="pc">'+pct+'%</span></div>'
      +   '</div>'
      + '</button>'
      + '<div class="row-right">'
      +   pillBtn('pick-status', i.id, i.status || '', DB.statuses)
      +   '<span class="stepper"><button data-act="bump" data-id="'+i.id+'" data-d="-1">−</button><span class="v">'+made+'</span><button data-act="bump" data-id="'+i.id+'" data-d="1">＋</button></span>'
      + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

function viewExchange(){
  const q = ui.ex.q.trim().toLowerCase();
  let list = DB.exchanges.slice();
  if (ui.ex.act !== 'all') list = list.filter(e => ui.ex.act === 'none' ? !e.activityId : e.activityId === ui.ex.act);
  if (ui.ex.status !== 'all') list = list.filter(e => (e.status || '待寄出') === ui.ex.status);
  if (ui.ex.tag !== 'all') list = list.filter(e => (e.tags || []).includes(ui.ex.tag));
  if (q) list = list.filter(e => ((e.partner||'') + (e.note||'') + (e.tags||[]).join(' ')).toLowerCase().includes(q));
  const rank = s => s === '已完成' ? 2 : (s === '待寄出' ? 1 : 0);
  list.sort((a,b) => rank(a.status) - rank(b.status) || (b.date || '').localeCompare(a.date || ''));

  const pending = list.filter(e => e.status !== '已完成');
  const totOut = list.reduce((s,e) => s + sumQty(e,'give'), 0);
  const totIn  = list.reduce((s,e) => s + sumQty(e,'receive'), 0);
  const pOut = pending.reduce((s,e) => s + sumQty(e,'give'), 0);
  const pIn  = pending.reduce((s,e) => s + sumQty(e,'receive'), 0);

  const actChips = sortActs(DB.activities).map(a =>
    '<button class="chip'+(ui.ex.act===a.id?' on':'')+'" data-act="ex-act" data-v="'+a.id+'">'+esc(a.name)
    + '<span class="cnt">'+DB.exchanges.filter(x => x.activityId === a.id).length+'</span></button>'

  +     '<button class="hd-btn" data-act="ex-new">＋ 记录</button></div>'
  +   '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
  +     '<input type="search" placeholder="搜索对象 / 备注 / 标签" value="'+esc(ui.ex.q)+'" data-input="ex-q"></div>'
  +   '<div class="seg">'
  +     '<button class="'+(ui.ex.group==='activity'?'on':'')+'" data-act="ex-group" data-v="activity">按活动</button>'
  +     '<button class="'+(ui.ex.group==='material'?'on':'')+'" data-act="ex-group" data-v="material">按物料</button>'
  +     '<button class="'+(ui.ex.group==='partner'?'on':'')+'" data-act="ex-group" data-v="partner">按人</button>'
  +   '</div>'
  +   '<div class="chips">'
  +     '<button class="chip'+(ui.ex.act==='all'?' on':'')+'" data-act="ex-act" data-v="all">全部活动</button>' + actChips
  +     '<button class="chip'+(ui.ex.act==='none'?' on':'')+'" data-act="ex-act" data-v="none">未挂活动</button>'
  +   '</div>'
  +   '<div class="chips">'
  +     '<button class="chip'+(ui.ex.status==='all'?' on':'')+'" data-act="ex-status" data-v="all">全部状态</button>' + stChips

function exSummaryLine(e){
  const g = (e.give||[]).map(l => {
    const it = itemById(l.itemId);
    return (it ? it.name : '已删物料') + ' ×' + num(l.qty);
  }).join('、');
  const r = (e.receive||[]).map(l => (l.name || '未命名') + ' ×' + num(l.qty)).join('、');
  return { g:g, r:r };
}

function exCard(e, showAct, hidePartner){

function exByActivity(list){
  let html = '';
  const secs = [];
  sortActs(DB.activities).forEach(a => {
    const its = list.filter(e => e.activityId === a.id);
    if (its.length) secs.push({ name:a.name, items:its });
  });
  const noAct = list.filter(e => !e.activityId);
  if (noAct.length) secs.push({ name:'未挂活动', items:noAct, muted:true });
  if (!secs.length){
    html += DB.exchanges.length
      ? emptyState('没有匹配的互换记录','换个筛选条件试试。','','')
      : emptyState('还没有互换记录','点右上角「＋ 记录」，记下和谁换了什么、\n你给出多少、收到多少，方便后续跟进。','新建互换记录','ex-new');
  }
  secs.forEach(sec => {
    let oOut = 0, oIn = 0;
    sec.items.forEach(e => { oOut += sumQty(e,'give'); oIn += sumQty(e,'receive'); });
    html += '<div class="group"><div class="group-head"><span class="t'+(sec.muted?' muted':'')+'">'+esc(sec.name)+'</span>'
      + '<span class="n">'+sec.items.length+' 笔</span><span class="rt">换出 '+oOut+' · 换入 '+oIn+'</span></div>'
      + '<div class="rows">' + sec.items.map(e => exCard(e, false)).join('') + '</div></div>';
  });
  return html;
}

function exByMaterial(list){
  const build = src => {
    const m = {};
    const bump = (key, field, qty, label) => {
      if (!key) return;
      if (!m[key]) m[key] = { out:0, in:0, label:label };
      m[key][field] += num(qty);
    };
    src.forEach(e => {
      (e.give||[]).forEach(l => {
        const it = itemById(l.itemId);
        bump(l.itemId, 'out', l.qty, it ? it.name : '（已删除）');
      });
      (e.receive||[]).forEach(l => bump('custom:' + (l.name||'').trim(), 'in', l.qty, (l.name||'').trim()));
    });
    return m;
  };
  const m = build(list);
  const keys = Object.keys(m);
  if (!keys.length) return emptyState('暂无互换数据','记录几笔互换后，这里会按物料汇总换出 / 换入 / 净变化。','','');

  keys.sort((a,b) => (m[b].out + m[b].in) - (m[a].out + m[a].in));
  let totOut = 0, totIn = 0;
  keys.forEach(k => { totOut += m[k].out; totIn += m[k].in; });
  const rows = keys.map(k => {
    const r = m[k];
    const it = itemById(k);
    const net = r.in - r.out;
    const label = r.label + (k.indexOf('custom:') === 0 ? ' <span class="tag">对方物料</span>' : '');
    return '<div class="tr"><div class="c1">' + (it ? thumbHTML(it,'sm') : '') + '<span class="nm">'+label+'</span></div>'
      + '<div class="c2" style="color:var(--orange)">'+r.out+'</div>'
      + '<div class="c3" style="color:var(--blue)">'+r.in+'</div>'
      + '<div class="c4" style="color:'+(net>=0?'var(--green)':'var(--red)')+'">'+(net>0?'+':'')+net+'</div></div>';
  }).join('');

  return ''
  + '<div class="group"><div class="group-head"><span class="t">按物料统计</span><span class="n">'+keys.length+' 种</span>'
  +   '<span class="rt">换出 '+totOut+' · 换入 '+totIn+'</span></div>'
  +   '<div class="tbl"><div class="tr head"><div class="c1">物料</div><div class="c2">换出</div><div class="c3">换入</div><div class="c4">净变化</div></div>'
  +   rows + '</div>'
  +   '<div class="setnote">净变化 = 换入 − 换出，正数表示净赚，负数表示净支出。</div></div>';
}

function exByPartner(list){
  const map = new Map();
  list.forEach(e => {
    const k = e.partner || '未填写';
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  });
  if (!map.size) return emptyState('暂无互换对象','记录几笔互换后，这里会按人汇总。','','');
  const partners = Array.from(map.keys()).sort((a,b) => {
    const ra = Math.min.apply(null, map.get(a).map(e => e.status === '已完成' ? 2 : 0));
    const rb = Math.min.apply(null, map.get(b).map(e => e.status === '已完成' ? 2 : 0));
    return ra - rb;
  });
  return partners.map(p => {
    const es = map.get(p);
    let oOut = 0, oIn = 0;
    es.forEach(e => { oOut += sumQty(e,'give'); oIn += sumQty(e,'receive'); });
    const byAct = new Map();
    es.forEach(e => {
      const k = e.activityId || 'none';
      if (!byAct.has(k)) byAct.set(k, []);
      byAct.get(k).push(e);
    });
    const cards = Array.from(byAct.keys()).map(k => {
      const its = byAct.get(k);
      let oo = 0, ii = 0;
      its.forEach(e => { oo += sumQty(e,'give'); ii += sumQty(e,'receive'); });
      return '<div style="background:var(--bg);border-radius:12px;padding:4px 10px 6px;margin-top:8px">'
        + '<div class="group-head" style="margin:6px 2px 2px"><span class="t" style="font-size:14px;'+(k==='none'?'color:var(--txt2)':'')+'">'+esc(k==='none'?'未挂活动':actName(k))+'</span>'
        + '<span class="n">'+its.length+' 笔</span><span class="rt">换出 '+oo+' · 换入 '+ii+'</span></div>'
        + its.map(e => exCard(e, false, true)).join('')
        + '</div>';
    }).join('');
    return '<div class="group"><div class="group-head"><span class="t">'+esc(p)+'</span>'
      + '<span class="n">'+es.length+' 笔</span><span class="rt">换出 '+oOut+' · 换入 '+oIn+'</span></div>'
      + '<div class="card" style="padding:10px">' + cards + '</div></div>';
  }).join('');
}

let sheetTimer = null;
function openSheet(title, bodyHTML, rightBtn){
  const root = $('#sheet-root');
  clearTimeout(sheetTimer);
  const rb = rightBtn
    ? '<button class="rt" id="sheet-save">'+esc(rightBtn)+'</button>'
    : '<span class="ph"></span>';
  $('#sheet').innerHTML = '<div class="grabber"></div>'
    + '<div class="sheet-hd"><button data-act="closeSheet">取消</button><span class="ttl">'+esc(title)+'</span>'
    + rb + '</div>'
    + '<div class="sheet-body">'+bodyHTML+'</div>';
  root.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('show')));
}
function openSheetRaw(title, bodyHTML){
  const root = $('#sheet-root');
  clearTimeout(sheetTimer);
  $('#sheet').innerHTML = '<div class="grabber"></div><div class="sheet-hd"><button data-act="closeSheet">取消</button>'
    + '<span class="ttl">'+esc(title)+'</span><span class="ph"></span></div><div class="sheet-body">'+bodyHTML+'</div>';
  root.classList.add('open');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('show')));
}
function closeSheet(){
  const root = $('#sheet-root');
  root.classList.remove('show');
  clearTimeout(sheetTimer);
  sheetTimer = setTimeout(() => { root.classList.remove('open'); $('#sheet').innerHTML=''; }, 300);
  draft = null; rxTarget = -1;
}

let dlgDone = null;
function confirmDialog(opt){
  return new Promise(res => {
    const root = $('#dialog-root');
    $('#dialog').innerHTML = '<div class="dt">'+esc(opt.title)+'</div>'
      + (opt.msg ? '<div class="dm">'+esc(opt.msg).replace(/\n/g,'<br>')+'</div>' : '')
      + '<div class="da"><button data-r="0">'+esc(opt.cancel||'取消')+'</button>'
      + '<button class="strong '+(opt.danger?'danger':'')+'" data-r="1">'+esc(opt.ok||'确定')+'</button></div>';
    root.classList.add('open');
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('show')));
    let settled = false;
    const done = v => {
      if (settled) return;
      settled = true; dlgDone = null;
      root.classList.remove('show');
      setTimeout(() => root.classList.remove('open'), 200);
      res(v);
    };
    dlgDone = done;
    $('#dialog').querySelectorAll('.da button').forEach(b => b.onclick = () => done(b.dataset.r === '1'));
  });
}

function collectItem(){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const tags = g('f-tags').split(/[,，\s]+/).map(s => s.replace(/^#/,'').trim()).filter(Boolean);
  const fl = flowOf(exchangeFlow(), draft && draft.id);
  const base = num(g('f-made')) - fl.out + fl.in;
  const stockRaw = g('f-stock');
  return {
    name: g('f-name'),
    category: g('f-cat'),
    status: g('f-status') || (DB.statuses[0] || {}).k || '',
    planQty: num(g('f-plan')),
    madeQty: num(g('f-made')),
    stockAdj: stockRaw === '' ? 0 : Math.round(num(stockRaw) - base),
    cost: g('f-cost') === '' ? '' : num(g('f-cost')),
    gotDate: g('f-got'),
    factory: g('f-factory'),
    designer: g('f-designer'),
    artist: g('f-artist'),
    tags: tags,
    note: g('f-note'),
    activityIds: (draft && draft.activityIds ? draft.activityIds : []).slice(),
  };
}

function saveItem(){
  const d = collectItem();
  if (!d.name){ toast('请填写物料名称'); return; }
  if (d.category && !DB.categories.includes(d.category)) DB.categories.push(d.category);
  if (draft && draft.id){
    const it = itemById(draft.id);
    Object.assign(it, d, { image: draft.image || null, updatedAt: Date.now() });
    toast('已保存');
  } else {
    DB.items.push(Object.assign({ id: uid(), image: (draft && draft.image) || null, createdAt: Date.now() }, d));
    toast('已创建物料');
  }
  save(); closeSheet(); render();
}

  const give = (draft.give || []).filter(l => l.itemId && num(l.qty) > 0).map(l => ({ itemId:l.itemId, qty:num(l.qty) }));
  const receive = (draft.receive || []).filter(l => (l.name || '').trim() && num(l.qty) > 0)
    .map(l => ({ name:(l.name || '').trim(), qty:num(l.qty), image:l.image || '' }));
  const st = g('f-status') || '待寄出';
  return {
    partner: g('f-partner'),
    activityId: g('f-act') || '',
    date: g('f-date') || todayStr(),
    status: st,
    tracking: st === '待寄出' ? g('f-track') : '',
    tags: g('f-tags').split(/[,，\s]+/).map(s => s.replace(/^#/,'').trim()).filter(Boolean),
    note: g('f-note'),
    give: give,
    receive: receive,
  };
}
function saveExchange(){
  const d = collectExchange();
  if (!d.partner){ toast('请填写互换对象'); return; }
  if (!d.give.length && !d.receive.length){ toast('至少记录一项给出或收到的物料'); return; }
  if (draft && draft.id){
    const e = DB.exchanges.find(x => x.id === draft.id);
    Object.assign(e, d, { updatedAt: Date.now() });
    toast('已保存');
  } else {
    DB.exchanges.push(Object.assign({ id: uid(), createdAt: Date.now() }, d));
    toast('已记录');
  }
  save(); closeSheet(); render();
}

  if (inp) inp.onchange = async () => {
    const f = inp.files && inp.files[0];

const GH_DEFAULT_PATH = 'backup/starmerch-backup.json';
function b64enc(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function ghRepoParts(){
  const parts = (ui.gh.repo || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/, '').split('/');
  if (parts.length !== 2 || !parts[0] || !parts[1]) return null;
  return { owner: parts[0], repo: parts[1] };
}
function ghPath(){
  return (ui.gh.path || GH_DEFAULT_PATH).trim().replace(/^\/+/, '');
}
async function ghRequest(url, opt){
  const r = await fetch(url, opt);
  if (!r.ok){
    let m = '';
    try { const j = await r.json(); m = j.message || ''; } catch(_){}
    throw new Error('HTTP ' + r.status + (m ? ' · ' + m : ''));
  }
  return r;
}
async function ghBackup(){
  const token = ui.gh.token.trim();
  const rp = ghRepoParts();
  if (!token){ toast('请先填写 GitHub Token'); return; }
  if (!rp){ toast('请先填写仓库，格式：用户名/仓库名'); return; }
  toast('正在备份…');
  try {
    const headers = {
      Authorization: 'Bearer ' + token,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    };
    const api = 'https://api.github.com/repos/' + rp.owner + '/' + rp.repo + '/contents/' + encodeURI(ghPath());
    const branch = (ui.gh.branch || 'main').trim() || 'main';
    const q = api + '?ref=' + encodeURIComponent(branch);
    let sha = null;
    const gr = await fetch(q, { headers: headers });
    if (gr.status === 200){ sha = (await gr.json()).sha; }
    else if (gr.status !== 404){ throw new Error('HTTP ' + gr.status + ' · 读取仓库失败，请检查仓库名与权限'); }
    const put = await ghRequest(api, {
      method: 'PUT',
      headers: headers,
      body: JSON.stringify({
        message: '备份 ' + new Date().toLocaleString('zh-CN'),
        content: b64enc(JSON.stringify(exportData())),
        branch: branch,
        sha: sha,
      })
    });
    ui.gh.last = Date.now();
    saveLocalCfg(); save(true); render();
    toast('备份成功：已提交到 ' + rp.owner + '/' + rp.repo);
  } catch(e){ toast('备份失败：' + e.message); }
}
async function ghRestore(){
  const token = ui.gh.token.trim();
  const rp = ghRepoParts();
  if (!token){ toast('请先填写 GitHub Token'); return; }
  if (!rp){ toast('请先填写仓库，格式：用户名/仓库名'); return; }
  toast('正在读取…');
  try {
    const branch = (ui.gh.branch || 'main').trim() || 'main';
    const api = 'https://api.github.com/repos/' + rp.owner + '/' + rp.repo + '/contents/' + encodeURI(ghPath())
      + '?ref=' + encodeURIComponent(branch);
    const r = await ghRequest(api, {
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github.raw+json' }
    });
    const obj = JSON.parse(await r.text());
    if (!obj || (!obj.items && !obj.activities && !obj.exchanges)) throw new Error('备份文件格式不正确');
    const ok = await confirmDialog({ title:'恢复云端备份？', msg:'将覆盖本机数据：物料 '+(obj.items||[]).length+' 件 / 互换 '+(obj.exchanges||[]).length+' 笔', ok:'覆盖恢复', danger:true });
    if (!ok) return;
    applyImport(obj);
    toast('已从 ' + rp.owner + '/' + rp.repo + ' 恢复');
  } catch(e){ toast('恢复失败：' + e.message); }
}

/* ---------- 图片处理 ---------- */
function compressImage(file, maxSize, quality){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const s = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
        x.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => rej(new Error('图片读取失败'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error('图片读取失败'));
    fr.readAsDataURL(file);
  });
}

    case 'ex-act':   ui.ex.act = btn.dataset.v; render(); return;
    case 'ex-status':ui.ex.status = btn.dataset.v; render(); return;
    case 'ex-tag':   ui.ex.tag = btn.dataset.v; render(); return;
    case 'theme':    ui.theme = btn.dataset.v; applyTheme(); saveLocalCfg(); render(); return;

    /* 物料 */
    case 'lib-new':
      draft = { image:null, activityIds:[] };
      openSheet('新建物料', itemFormHTML({ name:'', category:'', status:(DB.statuses[0]||{}).k||'', tags:[], image:null, planQty:0, madeQty:0, cost:'', gotDate:'' }), '创建');
      bindItemForm(); return;
    case 'open-item': openItemDetail(id); return;
    case 'edit-item': {
      const it = itemById(id); if (!it) return;
      draft = Object.assign({ activityIds: actsOf(it).slice() }, it);
      openSheet('编辑物料', itemFormHTML(it), '保存');
      bindItemForm(); return;
    }
    case 'del-item': {
      const ok = await confirmDialog({ title:'删除物料？', msg:'该物料的图片会一并删除，互换记录中的相关明细也会移除。', ok:'删除', danger:true });
      if (!ok) return;
      DB.items = DB.items.filter(x => x.id !== id);
      DB.exchanges.forEach(e => { e.give = (e.give||[]).filter(l => l.itemId !== id); });
      save(); closeSheet(); render(); toast('已删除');
      return;
    }
    case 'img-clear':
      if (draft){ draft.image = null; refreshItemImage(); }
      return;
    case 'pick-act': {
      if (!draft) return;
      const v = btn.dataset.v;
      draft.activityIds = draft.activityIds || [];
      const i = draft.activityIds.indexOf(v);
      if (i >= 0) draft.activityIds.splice(i, 1); else draft.activityIds.push(v);
      btn.classList.toggle('on', draft.activityIds.includes(v));
      return;
    }
    case 'bump': {
      const it = itemById(id); if (!it) return;
      it.madeQty = Math.max(0, num(it.madeQty) + num(btn.dataset.d));
      if (num(it.planQty) > 0 && it.madeQty >= num(it.planQty) && it.status !== '已完成') it.status = '已完成';
      save(); render(true); return;
    }
    case 'pick-status': openStatusPicker(id, DB.statuses, 'set-status'); return;
    case 'set-status': {
      const it = itemById(id);
      if (it){ it.status = btn.dataset.v; save(); }
      closeSheet(); render(); toast('状态已更新：' + btn.dataset.v);
      return;
    }

    /* 互换 */
    case 'ex-new':
      draft = { give:[{ itemId:'', qty:1 }], receive:[{ name:'', qty:1, image:'' }],
                date:todayStr(), status:'待面交', partner:'', activityId:'', tracking:'' };
      openSheet('新建互换记录', exFormHTML({ status:'待面交' }), '记录');
      bindExForm(); return;
    case 'open-ex': openExDetail(id); return;
    case 'ex-complete': {
      const e = DB.exchanges.find(x => x.id === id); if (!e) return;
      e.status = '已完成'; e.tracking = '';
      save(); closeSheet(); render(); toast('已完成 ✓');
      return;
    }
    case 'pick-ex-status': openStatusPicker(id, EX_STATUS, 'set-ex-status'); return;
    case 'set-ex-status': {
      const e = DB.exchanges.find(x => x.id === id);
      if (e){ e.status = btn.dataset.v; if (e.status !== '待寄出') e.tracking = ''; save(); }
      closeSheet(); render(); toast('状态已更新：' + btn.dataset.v);
      return;
    }
    case 'edit-ex': startEditExchange(id); return;
    case 'del-ex': {
      const ok = await confirmDialog({ title:'删除这条互换记录？', msg:'删除后不可恢复。', ok:'删除', danger:true });
      if (!ok) return;
      DB.exchanges = DB.exchanges.filter(x => x.id !== id);
      save(); closeSheet(); render(); toast('已删除');
      return;
    }
    case 'line-add':
      if (!draft) return;
      draft[btn.dataset.side].push(btn.dataset.side === 'give' ? { itemId:'', qty:1 } : { name:'', qty:1, image:'' });
      rerenderLines(btn.dataset.side); return;
    case 'line-del': {
      if (!draft) return;
      const s = btn.dataset.side;
      draft[s].splice(num(btn.dataset.idx), 1);
      if (!draft[s].length) draft[s].push(s === 'give' ? { itemId:'', qty:1 } : { name:'', qty:1, image:'' });
      rerenderLines(s); return;
    }
    case 'rx-img': {
      const inp = document.getElementById('rx-img-input');
      if (!inp) return;
      rxTarget = num(btn.dataset.idx);
      inp.click();
      return;
    }

    /* 活动 */
    case 'new-act':
      draft = {};
      openSheet('新建活动', actFormHTML({}), '创建');
      $('#sheet-save').dataset.mode = 'act';
      return;
    case 'edit-act': {
      const a = actRaw(id); if (!a) return;
      draft = a;
      openSheet('编辑活动', actFormHTML(a), '保存');
      $('#sheet-save').dataset.mode = 'act';
      return;
    }
    case 'del-act': {
      const a = actRaw(id); if (!a) return;
      const n = DB.items.filter(i => actsOf(i).includes(id)).length + DB.exchanges.filter(x => x.activityId === id).length;
      const ok = await confirmDialog({ title:'删除活动？', msg:'有 ' + n + ' 条数据挂在该活动下。删除后物料会取消该归属、互换变为「未挂活动」，不会被删除。', ok:'删除活动', danger:true });
      if (!ok) return;
      DB.activities = DB.activities.filter(x => x.id !== id);
      DB.items.forEach(i => { i.activityIds = (i.activityIds||[]).filter(x => x !== id); });
      DB.exchanges.forEach(x => { if (x.activityId === id) x.activityId = ''; });
      save(); closeSheet(); render(); toast('已删除');
      return;
    }

    /* 选项管理 */
    case 'act-expand': ui.actExpand = !ui.actExpand; render(); return;
    case 'mgr-cat': openCatMgr(); return;
    case 'cat-add': {
      const inp = document.getElementById('new-cat');
      const v = inp ? inp.value.trim() : '';
      if (!v){ toast('请输入类别名称'); return; }
      if (DB.categories.includes(v)){ toast('该类别已存在'); return; }
      DB.categories.push(v); save();
      openCatMgr(); toast('已添加「' + v + '」');
      return;
    }
    case 'cat-del': {
      const v = btn.dataset.v;
      DB.categories = DB.categories.filter(x => x !== v);
      save(); openCatMgr(); return;
    }
    case 'mgr-status': openStatusMgr(); return;
    case 'st-add': {
      const used = DB.statuses.map(s => s.c);
      const c = PALETTE.find(x => used.indexOf(x) < 0) || PALETTE[DB.statuses.length % PALETTE.length];
      DB.statuses.push({ k:'新状态', c:c });
      save(); renderStatusMgr(); return;
    }
    case 'st-del': {
      const i = num(btn.dataset.i);
      const s = DB.statuses[i]; if (!s) return;
      if (DB.statuses.length <= 1){ toast('至少保留一个状态'); return; }
      DB.items.forEach(it => { if (it.status === s.k) it.status = DB.statuses[0].k; });
      DB.statuses.splice(i, 1);
      save(); renderStatusMgr(); return;
    }
    case 'st-color': openPalette(num(btn.dataset.i)); return;
    case 'st-setcolor': {
      const i = num(btn.dataset.i);
      if (DB.statuses[i]){ DB.statuses[i].c = btn.dataset.c; save(); }
      openStatusMgr();
      return;
    }

    /* 弹层与数据 */
    case 'closeSheet': closeSheet(); return;
    case 'closeDialog': if (dlgDone) dlgDone(false); return;
    case 'export': doExport(); return;
    case 'import': doImport(); return;
    case 'gh-backup': ghBackup(); return;
    case 'gh-restore': ghRestore(); return;
    case 'seed': {
      if (DB.items.length || DB.activities.length){
        const ok = await confirmDialog({ title:'载入示例数据？', msg:'会覆盖当前本机数据。', ok:'载入', danger:true });
        if (!ok) return;
      }
      seedData(); return;
    }
    case 'clear': {
      const ok = await confirmDialog({ title:'清空全部数据？', msg:'将删除本机所有物料、活动与互换记录，且无法撤销。建议先导出备份。', ok:'确认清空', danger:true });
      if (!ok) return;
      DB = { version:2, activities:[], items:[], exchanges:[], categories:DEFAULT_CATEGORIES.slice(), statuses:JSON.parse(JSON.stringify(DEFAULT_STATUSES)) };
      save(true); render(); toast('已清空');
      return;
    }
  }
});

document.addEventListener('change', (ev) => {
  const t = ev.target;
  const act = t.dataset && t.dataset.act;
  if (!act) return;
  if (act === 'line-pick'){
    if (!draft) return;
    draft[t.dataset.side][num(t.dataset.idx)].itemId = t.value;
    rerenderLines(t.dataset.side);
  }
  if (act === 'st-name'){
    const i = num(t.dataset.i);
    const s = DB.statuses[i];
    if (!s) return;
    const nv = t.value.trim();
    if (!nv){ t.value = s.k; return; }
    if (DB.statuses.some((x,xi) => xi !== i && x.k === nv)){ toast('状态名重复'); t.value = s.k; return; }
    const old = s.k;
    s.k = nv;
    DB.items.forEach(it => { if (it.status === old) it.status = nv; });
    save();
  }
});

document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.input === 'lib-q'){ ui.lib.q = t.value; softRender(t); return; }
  if (t.dataset && t.dataset.input === 'plan-q'){ ui.plan.q = t.value; softRender(t); return; }
  if (t.dataset && t.dataset.input === 'ex-q'){ ui.ex.q = t.value; softRender(t); return; }
  if (t.dataset && t.dataset.input === 'gh-token'){ ui.gh.token = t.value; saveLocalCfg(); return; }
  if (t.dataset && t.dataset.input === 'gh-repo'){ ui.gh.repo = t.value; saveLocalCfg(); return; }
  if (t.dataset && t.dataset.input === 'gh-branch'){ ui.gh.branch = t.value; saveLocalCfg(); return; }
  if (t.dataset && t.dataset.input === 'gh-path'){ ui.gh.path = t.value; saveLocalCfg(); return; }
  const act = t.dataset && t.dataset.act;
  if (act === 'line-qty' && draft){ draft[t.dataset.side][num(t.dataset.idx)].qty = num(t.value); return; }
  if (act === 'line-name' && draft){ draft[t.dataset.side][num(t.dataset.idx)].name = t.value; return; }
});

let softTimer = null;
function softRender(inputEl){
  const val = inputEl.value, sel = inputEl.selectionStart;
  clearTimeout(softTimer);
  softTimer = setTimeout(() => {
    render(true);
    const again = document.querySelector('[data-input="' + inputEl.dataset.input + '"]');
    if (again){ again.value = val; again.focus(); try{ again.setSelectionRange(sel, sel); }catch(_){} }
  }, 220);
}

function refreshItemImage(){
  const ph = document.getElementById('img-ph');
  if (ph) ph.innerHTML = (draft && draft.image) ? '<img src="'+draft.image+'">' : '＋';
}
function bindItemForm(){
  actionSave = saveItem;
  const sb = $('#sheet-save'); if (sb) sb.dataset.mode = 'item';
  const inp = document.getElementById('img-input');
  if (inp) inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.value = '';
    if (!f) return;
    if (f.size > 12 * 1024 * 1024){ toast('图片过大，请选择 12MB 以内的图片'); return; }
    try {
      const d = await compressImage(f, 720, 0.75);
      draft.image = d;
      refreshItemImage();
      const b = document.getElementById('img-btn');
      if (b) b.textContent = '更换物料图';
    } catch(e){ toast('图片处理失败'); }
  };
  const pick = document.getElementById('img-ph');
  if (pick) pick.onclick = () => inp && inp.click();
  const pb = document.getElementById('img-btn');
  if (pb) pb.onclick = () => inp && inp.click();
}

/* ---------- 初始化 ---------- */
async function init(){
  loadLocalCfg();
  applyTheme();
  $('#tabbar').innerHTML = tabbarHTML();
  $('#tabbar').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-tab]');
    if (!b) return;
    ui.tab = b.dataset.tab; render();
  });
  const saved = await Store.get();
  if (saved && typeof saved === 'object'){
    DB.activities = saved.activities || [];
    DB.items = saved.items || [];
    DB.exchanges = saved.exchanges || [];
    DB.categories = saved.categories || [];
    DB.statuses = saved.statuses || [];
  }
  normalize();
  render();
}
init();
</script>
